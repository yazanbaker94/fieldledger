name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fieldledger
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fieldledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldledger -d fieldledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://fieldledger:ci-only-password@127.0.0.1:5432/fieldledger
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: bash deploy/test-native-release.sh
      - run: bash deploy/test-compose-assets.sh
      - name: Verify Compose image and asset volume
        env:
          POSTGRES_PASSWORD: compose-test-only
        run: |
          compose=(docker compose -p fieldledger-assets-ci)
          trap '"${compose[@]}" down --volumes' EXIT
          "${compose[@]}" config --quiet
          "${compose[@]}" build app
          "${compose[@]}" run --rm --no-deps -T app sh -ec '
            test "$(id -un)" = node
            test "$(stat -c %u /app/asset-cache)" = "$(id -u)"
            test "$(stat -c %u /app/asset-cache/.lock)" = "$(id -u)"
            snapshot=$(readlink -e /app/asset-cache/current)
            test "$PREVIOUS_ASSETS_DIRECTORY" = "$snapshot/previous-assets"
            diff -qr /app/dist/assets "$snapshot/assets"
          '
      - run: bash deploy/test-postgresql-recovery.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
